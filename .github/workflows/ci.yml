name: CI

# Branch pushes and pull requests, so a branch is verified before it is merged
# rather than only after. Tag pushes are deliberately excluded: a tag names a
# commit a branch push already verified, so sending it through the suite again
# spends runner minutes on an identical SHA without adding a signal. Note that
# naming `branches` here is what excludes tags -- a bare `push:` covers both.
#
# `merge_group` is what makes the merge queue work: a queued entry is a synthetic
# commit on a throwaway ref, so a `pull_request` run cannot vouch for it. The
# same suite runs again there, which is the price of the queue verifying the
# exact tree that will land on the branch.
#
# `workflow_dispatch` is the escape hatch: when a release does need verifying on
# demand, run the workflow from the Actions tab and pick the tag as the ref. A
# manual run is a deliberate request, so it is the one path that tests a tag.
#
# `schedule` catches the regressions a push cannot: a dependency publishing a
# breaking release, a test that only fails on a particular calendar date, or a
# fixture that silently aged out. Nothing has to change in this repository for
# those to break the build, so the suite runs against the default branch every
# night. Scheduled runs always use the default branch's copy of this file, and
# GitHub disables the schedule after 60 days without repository activity.
# 03:17 UTC keeps clear of the top-of-hour queue GitHub documents as busiest.
on:
  push:
    branches: ["**", "!gh-readonly-queue/**"]
  pull_request:
  # The merge queue builds each entry as a synthetic commit on a temporary ref, and
  # only a `merge_group` run reports on it. Without this trigger the required
  # checks would never arrive for a queued entry and every PR would sit in the
  # queue until it timed out.
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

# A new push supersedes the run for the same ref; the old one has nothing to add.
# The event is part of the group so a nightly run and a push on the same commit
# do not cancel each other: a cancelled schedule looks like a failure in the
# Actions list, and cancelling a push run would hide the signal it was run for.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  nightly-gate:
    # A red nightly means `master` itself is broken, and the nightly is the only
    # run that sees drift arriving without a push. Requiring that run directly is
    # impossible -- a `schedule`-only job never reports on a pull request's head
    # commit, so every PR would wait forever on a status that cannot be sent.
    # This job instead reads the last completed nightly and reds the PR while it
    # failed. The `nightly-fix` label is the one way past it: without a waiver
    # the fix PR would be blocked by the very failure it repairs, since a green
    # nightly cannot exist until the fix is merged.
    name: Nightly suite is green
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
    steps:
      - name: Read the last completed nightly run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          QUEUE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail

          # A merge_group payload carries no labels, so the waiver would silently
          # stop applying to a PR that had it. The queue ref names the PR it is
          # building (refs/heads/gh-readonly-queue/master/pr-123-abcdef), so read
          # the labels the pull request gate already honoured.
          labels="${LABELS:-}"
          if [ "${GITHUB_EVENT_NAME:-}" = "merge_group" ] && [ -z "$labels" ]; then
            pr=$(sed -n 's#.*/pr-\([0-9]\{1,\}\)-.*#\1#p' <<<"${QUEUE_HEAD_REF:-}")
            if [ -n "$pr" ]; then
              labels=$(gh api "repos/$REPO/pulls/$pr" --jq '[.labels[].name] | join(",")' 2>/dev/null || true)
              [ -n "$labels" ] || echo "::notice::Could not read the labels of PR #$pr; treating it as unlabelled."
            fi
          fi

          # Fail closed: if the runs cannot be read, nothing proves the nightly
          # is green, and an unverified night is not a verified one.
          runs=$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?event=schedule&branch=master&per_page=20") || {
            echo "::error::Could not read the nightly runs, so this PR cannot be verified against them."
            exit 1
          }

          latest=$(jq -c '[.workflow_runs[] | select(.status == "completed")] | first // empty' <<<"$runs")
          if [ -z "$latest" ]; then
            echo "::notice::No nightly run has finished yet, so there is nothing to gate against."
            exit 0
          fi

          conclusion=$(jq -r '.conclusion' <<<"$latest")
          sha=$(jq -r '.head_sha[0:7]' <<<"$latest")
          url=$(jq -r '.html_url' <<<"$latest")
          when=$(jq -r '.created_at' <<<"$latest")

          {
            echo "### Nightly suite: $conclusion"
            echo ""
            echo "Last scheduled run on \`$sha\`, $when — [$conclusion]($url)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$conclusion" = "success" ]; then
            echo "The last nightly passed."
            exit 0
          fi

          # A cancelled or skipped night proves nothing either way; it is not a
          # red night, so it does not block. Only a genuine failure does.
          if [ "$conclusion" = "cancelled" ] || [ "$conclusion" = "skipped" ]; then
            echo "::notice::The last nightly was $conclusion, which proves nothing about master; not blocking on it."
            exit 0
          fi

          case ",${labels:-}," in
            *,nightly-fix,*)
              echo "::warning::The last nightly failed ($url) but this change carries the nightly-fix label, so it may proceed. The three test jobs are still required."
              exit 0
              ;;
          esac

          echo "::error::The nightly run on $sha failed ($url). Fix master, or label this PR nightly-fix if it is the fix, before merging."
          exit 1

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The test fixtures create their own `finance_test` database and run
        # migrations into it; they only need a reachable server and the matching
        # credentials below.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance_dev_password
          POSTGRES_DB: finance
        ports:
          # The fixtures default to 55432, the port the local container uses, so
          # CI exercises the same configuration as a developer machine.
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "55432"
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance_dev_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install into backend/.venv
        working-directory: backend
        # The fixtures invoke `backend/.venv/bin/alembic` by path, so the virtualenv
        # has to exist in exactly that place — a bare `pip install` would not do.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'
      - name: Run tests
        working-directory: backend
        run: .venv/bin/python -m pytest

  web:
    name: Web typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Check every documentation image exists
        # Deliberately in this job rather than one of its own: only the three
        # required checks plus the nightly gate can block a merge, so a separate
        # job would go red and still let the pull request through. It also runs
        # before `npm ci`, so a renamed screenshot fails in seconds instead of
        # after a dependency install.
        working-directory: .
        run: ./scripts/verify-doc-images
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck the app and the Playwright harness
        # `typecheck` runs both projects (tsconfig.json and tsconfig.e2e.json), so a
        # type error in a spec fails the build, not just in application code.
        run: npm run typecheck
      - name: Run tests
        run: npm test

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # gradle/gradle-daemon-jvm.properties pins the daemon to 17, so the
          # toolchain Gradle launches must be 17 and not the runner's default JDK.
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        # compileSdk 36 is on the runner image; AGP installs any missing SDK
        # component itself because the image already accepts the licences.
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble with a custom server address
        # The default address is the emulator loopback, so a broken
        # `pfcApiBaseUrl` override would not surface until someone built an APK
        # for a real server. Assemble with a LAN address and prove the value
        # reached the APK rather than assuming the property was read.
        run: |
          set -euo pipefail
          base=http://10.0.2.2:8088/api/v1
          ./gradlew :app:assembleDebug -PpfcApiBaseUrl="$base" --stacktrace
          apk=app/build/outputs/apk/debug/app-debug.apk
          found=0
          for dex in $(unzip -Z1 "$apk" | grep -E '^classes[0-9]*\.dex$'); do
            if unzip -p "$apk" "$dex" | strings | grep -qF "$base"; then
              found=1
              break
            fi
          done
          test "$found" = 1 || {
            echo "::error::pfcApiBaseUrl did not reach the APK; the override is broken"
            exit 1
          }

  nightly-alert:
    # A nightly failure has nobody watching it: it arrives at 03:17 with no push
    # and no author, and the next person to notice is whoever reads the Actions
    # tab days later. This files an issue instead.
    #
    # One issue, reopened by comment: a new issue every red night would bury the
    # repository in duplicates of the same breakage, so an open `ci-nightly`
    # issue is updated rather than duplicated.
    #
    # The same job closes it once a night passes again. An issue that stays open
    # after the breakage is fixed is worse than no issue: it teaches whoever reads
    # the list to ignore it, and it leaves the repository claiming a failure that
    # has stopped happening. The close runs only when all three suites passed -- a
    # cancelled or skipped night proves nothing and leaves the issue alone, which
    # is the same rule the `Nightly suite is green` gate applies.
    name: Nightly failure alert
    needs: [backend, web, android]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        if: contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BACKEND: ${{ needs.backend.result }}
          WEB: ${{ needs.web.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          set -euo pipefail

          short=${SHA:0:7}
          today=$(date -u +%Y-%m-%d)

          # Labels are referenced by name when the issue is created, so make sure
          # it exists. A 422 means it already does, which is the normal case.
          gh api "repos/$REPO/labels" -X POST \
            -f name=ci-nightly \
            -f color=B60205 \
            -f description="A scheduled CI run failed on the default branch" \
            >/dev/null 2>&1 || true

          body=$(cat <<EOF
          The scheduled CI run on \`master\` failed at commit \`$short\` on $today.

          - [Run log]($RUN_URL)
          - Backend tests: **$BACKEND**
          - Web typecheck and tests: **$WEB**
          - Android unit tests: **$ANDROID**

          Nothing was pushed to cause this: a nightly failure usually means drift from
          outside the repository — a dependency release, a test that only fails on a
          particular calendar date, or a fixture that aged out. Reproduce locally with
          the same timezone the runners use before assuming the code changed:

          \`\`\`bash
          cd backend && TZ=UTC .venv/bin/python -m pytest
          cd web && npm test
          cd android && ./gradlew :app:testDebugUnitTest
          \`\`\`

          A red nightly blocks the next merge through the \`Nightly suite is green\`
          check, so this is not advisory.
          EOF
          )

          existing=$(gh issue list --repo "$REPO" --label ci-nightly --state open \
            --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "::notice::Commented on the existing nightly failure issue #$existing."
          else
            gh issue create --repo "$REPO" \
              --title "Nightly CI failed on master" \
              --label ci-nightly \
              --body "$body"
          fi

      - name: Close the issue once the night is green
        # Only a fully passing night closes it: `cancelled` and `skipped` prove
        # nothing either way, so they leave the issue as it was.
        if: ${{ needs.backend.result == 'success' && needs.web.result == 'success' && needs.android.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Every open one, not just the first: the alert only ever creates one, but
          # a hand-filed duplicate should not outlive the failure it describes.
          open=$(gh issue list --repo "$REPO" --label ci-nightly --state open \
            --limit 10 --json number --jq '.[].number')

          if [ -z "$open" ]; then
            echo "No open ci-nightly issue; the night is green and there is nothing to close."
            exit 0
          fi

          body=$(cat <<EOF
          The scheduled CI run on \`master\` passed again at commit \`${SHA:0:7}\`, so the
          failure this issue describes has stopped happening.

          - [Run log]($RUN_URL)
          - Backend tests: **success**
          - Web typecheck and tests: **success**
          - Android unit tests: **success**

          Closing automatically. If it recurs, the next red night opens or updates an
          issue again, so nothing is lost by letting this one go.
          EOF
          )

          for number in $open; do
            gh issue comment "$number" --repo "$REPO" --body "$body"
            gh issue close "$number" --repo "$REPO" --reason completed
            echo "::notice::Closed nightly failure issue #$number: the night is green again."
          done
