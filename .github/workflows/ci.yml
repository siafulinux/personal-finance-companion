name: CI

# Branch pushes and pull requests, so a branch is verified before it is merged
# rather than only after. Tag pushes are deliberately excluded: a tag names a
# commit a branch push already verified, so sending it through the suite again
# spends runner minutes on an identical SHA without adding a signal. Note that
# naming `branches` here is what excludes tags -- a bare `push:` covers both.
#
# `merge_group` is what makes the merge queue work: a queued entry is a synthetic
# commit on a throwaway ref, so a `pull_request` run cannot vouch for it. The
# same suite runs again there, which is the price of the queue verifying the
# exact tree that will land on the branch.
#
# `workflow_dispatch` is the escape hatch: when a release does need verifying on
# demand, run the workflow from the Actions tab and pick the tag as the ref. A
# manual run is a deliberate request, so it is the one path that tests a tag.
#
# `schedule` catches the regressions a push cannot: a dependency publishing a
# breaking release, a test that only fails on a particular calendar date, or a
# fixture that silently aged out. Nothing has to change in this repository for
# those to break the build, so the suite runs against the default branch every
# night. Scheduled runs always use the default branch's copy of this file, and
# GitHub disables the schedule after 60 days without repository activity.
# 03:17 UTC keeps clear of the top-of-hour queue GitHub documents as busiest.
on:
  push:
    branches: ["**", "!gh-readonly-queue/**"]
  pull_request:
  # The merge queue builds each entry as a synthetic commit on a temporary ref, and
  # only a `merge_group` run reports on it. Without this trigger the required
  # checks would never arrive for a queued entry and every PR would sit in the
  # queue until it timed out.
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

# A new push supersedes the run for the same ref; the old one has nothing to add.
# The event is part of the group so a nightly run and a push on the same commit
# do not cancel each other: a cancelled schedule looks like a failure in the
# Actions list, and cancelling a push run would hide the signal it was run for.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  nightly-gate:
    # A red nightly means `master` itself is broken, and the nightly is the only
    # run that sees drift arriving without a push. Requiring that run directly is
    # impossible -- a `schedule`-only job never reports on a pull request's head
    # commit, so every PR would wait forever on a status that cannot be sent.
    # This job instead reads the last completed nightly and reds the PR while it
    # failed. The `nightly-fix` label is the one way past it: without a waiver
    # the fix PR would be blocked by the very failure it repairs, since a green
    # nightly cannot exist until the fix is merged.
    name: Nightly suite is green
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: read
    steps:
      - name: Read the last completed nightly run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          QUEUE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail

          # A merge_group payload carries no labels, so the waiver would silently
          # stop applying to a PR that had it. The queue ref names the PR it is
          # building (refs/heads/gh-readonly-queue/master/pr-123-abcdef), so read
          # the labels the pull request gate already honoured.
          labels="${LABELS:-}"
          if [ "${GITHUB_EVENT_NAME:-}" = "merge_group" ] && [ -z "$labels" ]; then
            pr=$(sed -n 's#.*/pr-\([0-9]\{1,\}\)-.*#\1#p' <<<"${QUEUE_HEAD_REF:-}")
            if [ -n "$pr" ]; then
              labels=$(gh api "repos/$REPO/pulls/$pr" --jq '[.labels[].name] | join(",")' 2>/dev/null || true)
              [ -n "$labels" ] || echo "::notice::Could not read the labels of PR #$pr; treating it as unlabelled."
            fi
          fi

          # Fail closed: if the runs cannot be read, nothing proves the nightly
          # is green, and an unverified night is not a verified one.
          runs=$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?event=schedule&branch=master&per_page=20") || {
            echo "::error::Could not read the nightly runs, so this PR cannot be verified against them."
            exit 1
          }

          latest=$(jq -c '[.workflow_runs[] | select(.status == "completed")] | first // empty' <<<"$runs")
          if [ -z "$latest" ]; then
            echo "::notice::No nightly run has finished yet, so there is nothing to gate against."
            exit 0
          fi

          conclusion=$(jq -r '.conclusion' <<<"$latest")
          sha=$(jq -r '.head_sha[0:7]' <<<"$latest")
          url=$(jq -r '.html_url' <<<"$latest")
          when=$(jq -r '.created_at' <<<"$latest")

          {
            echo "### Nightly suite: $conclusion"
            echo ""
            echo "Last scheduled run on \`$sha\`, $when — [$conclusion]($url)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$conclusion" = "success" ]; then
            echo "The last nightly passed."
            exit 0
          fi

          # A cancelled or skipped night proves nothing either way; it is not a
          # red night, so it does not block. Only a genuine failure does.
          if [ "$conclusion" = "cancelled" ] || [ "$conclusion" = "skipped" ]; then
            echo "::notice::The last nightly was $conclusion, which proves nothing about master; not blocking on it."
            exit 0
          fi

          case ",${labels:-}," in
            *,nightly-fix,*)
              echo "::warning::The last nightly failed ($url) but this change carries the nightly-fix label, so it may proceed. Every required check is still enforced."
              exit 0
              ;;
          esac

          echo "::error::The nightly run on $sha failed ($url). Fix master, or label this PR nightly-fix if it is the fix, before merging."
          exit 1

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The test fixtures create their own `finance_test` database and run
        # migrations into it; they only need a reachable server and the matching
        # credentials below.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance_dev_password
          POSTGRES_DB: finance
        ports:
          # The fixtures default to 55432, the port the local container uses, so
          # CI exercises the same configuration as a developer machine.
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "55432"
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance_dev_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Check the tag gate's own regression suite
        # The gate decides whether a commit may be tagged, so a silent change to
        # `scripts/verify-ci` lets a red commit be released -- the one failure the
        # gate exists to prevent. Its cases use a fake `gh` and canned payloads,
        # so they need no credentials and no database, and they run before the
        # install: a regression here fails in seconds rather than after a venv.
        working-directory: .
        run: ./scripts/verify-ci-test
      - name: Install into backend/.venv
        working-directory: backend
        # The fixtures invoke `backend/.venv/bin/alembic` by path, so the virtualenv
        # has to exist in exactly that place — a bare `pip install` would not do.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'
      - name: Run tests
        working-directory: backend
        run: .venv/bin/python -m pytest

  # The nightly can only catch a calendar bug on the night it happens to be the
  # problematic date, and a stale-looking failure on the 30th of a month is hard
  # to tell apart from a real regression. This job moves the clock instead, so a
  # fixture that assumes a 30-day November, or that a month-end date exists, or
  # that UTC midnight is already "tomorrow" for the user, fails on a normal day.
  #
  # The clock is only shifted for these runs; the scheduled and pushed suites
  # still use the real one. `libfaketime` is used rather than overriding a
  # `PFC_TODAY` variable on purpose: only a real clock exercises the code that
  # calls the clock, which is where the date arithmetic bugs actually live.
  backend-calendar:
    name: Backend on a shifted clock (${{ matrix.why }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One bad date should not hide the others; each is its own signal.
      fail-fast: false
      matrix:
        include:
          # Leap day, so anything that builds a date from month/day arithmetic
          # and assumes a 28-day February breaks here rather than in production.
          - why: leap day 2028-02-29
            today: "2028-02-29 12:00:00"
          # 02:00 UTC on the 1st is still the evening of the 30th in the
          # Americas, so a fixture reading UTC "today" while the user's local
          # date is the previous month produces rows a month into their future.
          - why: month end at UTC midnight
            today: "2028-12-01 02:00:00"
          # The same skew across February, where the two sides differ by a day
          # and a month rather than just a month.
          - why: month end after the leap day
            today: "2027-03-01 03:00:00"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance_dev_password
          POSTGRES_DB: finance
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "55432"
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance_dev_password
      TODAY: ${{ matrix.today }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install libfaketime
        # libfaketime intercepts the C library's clock calls, so the shift
        # covers subprocesses too -- the migrations the fixtures run through
        # `alembic` get the same date as the tests themselves.
        #
        # The shared object is preloaded by path rather than through the
        # `faketime` wrapper. That wrapper expands a compiled-in path and, when
        # it cannot find the library, prints a line to stderr and runs the
        # command anyway with the real clock -- so a broken install would leave
        # this job green while testing today's date. The path is resolved here
        # and the step below verifies the shift actually happened.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends faketime ||
            sudo apt-get install -y --no-install-recommends libfaketime1
          lib=$(ls /usr/lib/*/faketime/libfaketime.so.1 2>/dev/null | head -1)
          if [ -z "$lib" ]; then
            echo "::error::libfaketime.so.1 is not installed, so the clock cannot be shifted."
            exit 1
          fi
          echo "FAKETIME_LIB=$lib" >> "$GITHUB_ENV"
          echo "Resolved $lib"
      - name: Install into backend/.venv
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'
      - name: Prove the clock shifted
        # Fail closed. If the preload did not take effect, every test below runs
        # on today's date and the job would report a false pass -- the one
        # outcome this job must never produce.
        #
        # Both zones are printed because the difference between them is the bug
        # being sought, and a failed run has to say which clock it was using.
        run: |
          set -euo pipefail
          want=${TODAY%% *}
          shifted=$(LD_PRELOAD="$FAKETIME_LIB" FAKETIME="@$TODAY" \
            FAKETIME_DONT_FAKE_MONOTONIC=1 date -u '+%Y-%m-%d')
          echo "real UTC date:    $(date -u '+%Y-%m-%d')"
          echo "shifted UTC date: $shifted  (wanted $want)"
          LD_PRELOAD="$FAKETIME_LIB" FAKETIME="@$TODAY" FAKETIME_DONT_FAKE_MONOTONIC=1 \
            env TZ=America/New_York date '+user-local:      %Y-%m-%d %H:%M %Z'
          if [ "$shifted" != "$want" ]; then
            echo "::error::The clock is $shifted, not $want, so this job would have tested today's date and proved nothing."
            exit 1
          fi
      - name: Run tests with the clock shifted
        working-directory: backend
        # FAKETIME_DONT_FAKE_MONOTONIC keeps the monotonic clock real: shifting
        # it stalls timeouts, connection retries and the event loop's own timers,
        # which produces hangs rather than date failures. Only the wall clock is
        # the subject here.
        run: |
          LD_PRELOAD="$FAKETIME_LIB" FAKETIME="@$TODAY" FAKETIME_DONT_FAKE_MONOTONIC=1 \
            .venv/bin/python -m pytest

  web:
    name: Web typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Test the release-body checks against fixtures
        # Runs before the check it guards: if the trailing-separator rule were
        # ever dropped from verify-releases, the check below would go back to
        # passing on a body that ends with `---`, which is exactly the silent
        # return this test exists to prevent. Offline -- fake gh, fixture
        # changelog, no token.
        #
        # `release-drift-report-test` covers the naming a scheduled night uses.
        # It runs here as well as in `release-notes` because this job runs on
        # every push and pull request, while that one only runs on a schedule: a
        # regression there would otherwise reach a night before CI saw it.
        working-directory: .
        run: |
          ./scripts/verify-releases-test
          ./scripts/release-drift-report-test
      - name: Check every published release still matches the changelog
        # Also in this job, for the same reason: a standalone job could go red
        # without blocking a merge. A release body is generated from the
        # changelog once and can drift afterwards -- notes edited on GitHub the
        # changelog never learned about, or a changelog entry rewritten without
        # updating the release -- which leaves the published page contradicting
        # the repository. Editing a shipped version's section therefore means
        # editing its release notes in the same change; this check says so
        # before the merge rather than after.
        #
        # Not on a scheduled night: `release-notes` below runs the same check then
        # and names the drifting release. Leaving it here as well would redden two
        # jobs for one cause and file the night under "Web typecheck and tests",
        # which points at the frontend while the fault is a release body.
        if: github.event_name != 'schedule'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Exit 1 is drift and must fail immediately. Exit 2 means the releases
          # could not be read (an API blip, a rate limit), which is not drift, so
          # it is retried twice before being treated as a failure -- the check
          # still fails closed, but a single dropped request does not redden
          # every pull request for ten minutes.
          for attempt in 1 2 3; do
            status=0
            ./scripts/verify-releases || status=$?
            [ "$status" -eq 0 ] && exit 0
            if [ "$status" -ne 2 ]; then
              echo "::error::A published release no longer matches its changelog section."
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::The releases could not be read (attempt $attempt of 3); retrying."
              sleep 5
            fi
          done

          echo "::error::The published releases could not be read, so this check could not verify them."
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck the app and the Playwright harness
        # `typecheck` runs both projects (tsconfig.json and tsconfig.e2e.json), so a
        # type error in a spec fails the build, not just in application code.
        run: npm run typecheck
      - name: Run tests
        run: npm test

  release-notes:
    name: Release notes match the changelog
    # The nightly copy of the check above, kept separate for one reason: naming.
    # On a push or a pull request the check has to live inside `web` so it can
    # block a merge, but a night has no merge to block, and a drift-only night
    # reported as "Web typecheck and tests" sends whoever reads the issue to the
    # frontend. This job fails on its own name instead, and its annotations name
    # the release and the changelog section that disagree.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test the release-body checks against fixtures
        # The same guards the `web` job runs: naming a drift is only worth
        # anything if the check it reports on still enforces its rules, and if
        # the naming itself still names the right pair.
        run: |
          ./scripts/verify-releases-test
          ./scripts/release-drift-report-test
      - name: Name every release whose notes no longer match its section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Kept in a file rather than a variable: the diff for a drifted release
          # can be long, and it is what a reader needs to see.
          out=$(mktemp)
          status=0

          # Same contract as the `web` job: 1 is drift and fails at once, 2 means
          # the releases could not be read and is retried before failing closed.
          for attempt in 1 2 3; do
            status=0
            ./scripts/verify-releases >"$out" 2>&1 || status=$?
            [ "$status" -eq 0 ] && break
            [ "$status" -eq 2 ] || break
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::The releases could not be read (attempt $attempt of 3); retrying."
              sleep 5
            fi
          done

          cat "$out"
          [ "$status" -eq 0 ] && exit 0

          if [ "$status" -ne 1 ]; then
            echo "::error title=Release notes could not be read::The published releases could not be read, so drift cannot be ruled out."
            exit 1
          fi

          # One annotation per broken pair, so the summary lists every release
          # that drifted rather than just the fact that something did. The naming
          # lives in a script so `release-drift-report-test` can pin it: an inline
          # awk here could regress to a generic message with nothing failing.
          # Reporting only -- this step keeps the exit status that fails the job.
          ./scripts/release-drift-report "$out"
          exit 1

  docs:
    name: Documented images and links
    # Its own job so the documentation check owns its status: it is a required
    # check on master, so a renamed screenshot or a link to a page that no longer
    # exists blocks a merge by itself instead of riding along with the web suite.
    # Nothing else runs here, so it finishes in seconds -- the docs are read with
    # git and python3 only, no dependency install.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check documented images and inter-document links exist
        run: ./scripts/verify-doc-images

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # gradle/gradle-daemon-jvm.properties pins the daemon to 17, so the
          # toolchain Gradle launches must be 17 and not the runner's default JDK.
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        # compileSdk 36 is on the runner image; AGP installs any missing SDK
        # component itself because the image already accepts the licences.
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble with a custom server address
        # The default address is the emulator loopback, so a broken
        # `pfcApiBaseUrl` override would not surface until someone built an APK
        # for a real server. Assemble with a LAN address and prove the value
        # reached the APK rather than assuming the property was read.
        run: |
          set -euo pipefail
          base=http://10.0.2.2:8088/api/v1
          ./gradlew :app:assembleDebug -PpfcApiBaseUrl="$base" --stacktrace
          apk=app/build/outputs/apk/debug/app-debug.apk
          found=0
          for dex in $(unzip -Z1 "$apk" | grep -E '^classes[0-9]*\.dex$'); do
            if unzip -p "$apk" "$dex" | strings | grep -qF "$base"; then
              found=1
              break
            fi
          done
          test "$found" = 1 || {
            echo "::error::pfcApiBaseUrl did not reach the APK; the override is broken"
            exit 1
          }

  nightly-alert:
    # A nightly failure has nobody watching it: it arrives at 03:17 with no push
    # and no author, and the next person to notice is whoever reads the Actions
    # tab days later. This files an issue instead.
    #
    # One issue, reopened by comment: a new issue every red night would bury the
    # repository in duplicates of the same breakage, so an open `ci-nightly`
    # issue is updated rather than duplicated.
    #
    # The same job closes it once a night passes again. An issue that stays open
    # after the breakage is fixed is worse than no issue: it teaches whoever reads
    # the list to ignore it, and it leaves the repository claiming a failure that
    # has stopped happening. The close runs only when every suite passed -- a
    # cancelled or skipped night proves nothing and leaves the issue alone, which
    # is the same rule the `Nightly suite is green` gate applies.
    #
    # `release-notes` is one of those suites: drift between a published release and
    # its changelog is only visible from the API, so it is exactly the kind of
    # breakage a night has to report.
    name: Nightly failure alert
    needs: [backend, web, android, release-notes]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        if: contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BACKEND: ${{ needs.backend.result }}
          WEB: ${{ needs.web.result }}
          ANDROID: ${{ needs.android.result }}
          RELEASE_NOTES: ${{ needs.release-notes.result }}
        run: |
          set -euo pipefail

          short=${SHA:0:7}
          today=$(date -u +%Y-%m-%d)

          # Labels are referenced by name when the issue is created, so make sure
          # it exists. A 422 means it already does, which is the normal case.
          gh api "repos/$REPO/labels" -X POST \
            -f name=ci-nightly \
            -f color=B60205 \
            -f description="A scheduled CI run failed on the default branch" \
            >/dev/null 2>&1 || true

          body=$(cat <<EOF
          The scheduled CI run on \`master\` failed at commit \`$short\` on $today.

          - [Run log]($RUN_URL)
          - Backend tests: **$BACKEND**
          - Web typecheck and tests: **$WEB**
          - Android unit tests: **$ANDROID**
          - Release notes match the changelog: **$RELEASE_NOTES**

          Nothing was pushed to cause this: a nightly failure usually means drift from
          outside the repository — a dependency release, a test that only fails on a
          particular calendar date, or a fixture that aged out. Reproduce locally with
          the same timezone the runners use before assuming the code changed:

          \`\`\`bash
          cd backend && TZ=UTC .venv/bin/python -m pytest
          cd web && npm test
          cd android && ./gradlew :app:testDebugUnitTest
          \`\`\`

          A red nightly blocks the next merge through the \`Nightly suite is green\`
          check, so this is not advisory.
          EOF
          )

          existing=$(gh issue list --repo "$REPO" --label ci-nightly --state open \
            --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "::notice::Commented on the existing nightly failure issue #$existing."
          else
            gh issue create --repo "$REPO" \
              --title "Nightly CI failed on master" \
              --label ci-nightly \
              --body "$body"
          fi

      - name: Close the issue once the night is green
        # Only a fully passing night closes it: `cancelled` and `skipped` prove
        # nothing either way, so they leave the issue as it was.
        if: ${{ needs.backend.result == 'success' && needs.web.result == 'success' && needs.android.result == 'success' && needs.release-notes.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Every open one, not just the first: the alert only ever creates one, but
          # a hand-filed duplicate should not outlive the failure it describes.
          open=$(gh issue list --repo "$REPO" --label ci-nightly --state open \
            --limit 10 --json number --jq '.[].number')

          if [ -z "$open" ]; then
            echo "No open ci-nightly issue; the night is green and there is nothing to close."
            exit 0
          fi

          body=$(cat <<EOF
          The scheduled CI run on \`master\` passed again at commit \`${SHA:0:7}\`, so the
          failure this issue describes has stopped happening.

          - [Run log]($RUN_URL)
          - Backend tests: **success**
          - Web typecheck and tests: **success**
          - Android unit tests: **success**
          - Release notes match the changelog: **success**

          Closing automatically. If it recurs, the next red night opens or updates an
          issue again, so nothing is lost by letting this one go.
          EOF
          )

          for number in $open; do
            gh issue comment "$number" --repo "$REPO" --body "$body"
            gh issue close "$number" --repo "$REPO" --reason completed
            echo "::notice::Closed nightly failure issue #$number: the night is green again."
          done
