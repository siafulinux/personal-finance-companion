# Static hosting for the built React app. The API is reached through the
# reverse proxy in front of this container, so nginx only serves files.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Content-hashed bundles can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The app shell must never be cached, or a deploy leaves clients on old code.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes (/dashboard, /connections, …) all resolve to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
