name: finance-companion

services:
  db:
    image: postgres:17-alpine
    container_name: pfc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
      TZ: ${APP_TIMEZONE:-UTC}
      PGTZ: ${APP_TIMEZONE:-UTC}
    ports:
      # Bind to loopback only. Never expose the finance database publicly.
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
