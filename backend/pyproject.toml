[project]
name = "finance-companion-backend"
version = "0.1.0"
description = "Personal Finance Companion - Phase 1 backend, financial engine and API"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "email-validator==2.2.0",
    "python-multipart==0.0.20",
    "PyJWT==2.10.1",
    "argon2-cffi==23.1.0",
    "typer==0.15.1",
    # Typer 0.15 relies on Click internals removed in Click 8.2+; keep the supported line.
    "click==8.1.8",
    "psycopg-pool==3.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "pytest-cov==6.0.0",
]

[project.scripts]
pfc = "app.cli.main:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
