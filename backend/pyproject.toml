[project]
name = "finance-companion-backend"
version = "0.1.0"
description = "Personal Finance Companion backend: financial engine, API and sync worker"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "email-validator==2.2.0",
    "python-multipart==0.0.20",
    "PyJWT==2.10.1",
    "argon2-cffi==23.1.0",
    # Provider access tokens are encrypted at rest (app/security/secrets.py).
    "cryptography==46.0.7",
    "typer==0.15.1",
    # Typer 0.15 relies on Click internals removed in Click 8.2+; keep the supported line.
    "click==8.1.8",
    "psycopg-pool==3.2.4",
    # Runtime dependency, not a test helper: the Plaid adapter and the optional AI
    # provider both speak HTTP with it. A production `pip install .` needs it.
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
]

[project.scripts]
pfc = "app.cli.main:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Deprecation chatter from third-party libraries is not this project's problem.
    "ignore::DeprecationWarning",
    # SQLAlchemy's warnings are signals, not noise: "expected to delete N row(s); 0
    # were matched" is how a double delete announces itself, and it used to scroll by
    # in a passing run. A SAWarning now fails the test that provoked it.
    "error::sqlalchemy.exc.SAWarning",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
